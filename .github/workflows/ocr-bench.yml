# OCR benchmark (desktop proxy), run by hand only: generates the synthetic sets, runs the engines and
# uploads the scores. No push or schedule trigger (minutes and write budget); no secrets.
# See tools/ocr-bench/README.md and docs/ocr-benchmark.md.
name: OCR benchmark

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Set from tools/ocr-bench/sets.json (dev or heldout)"
        default: "heldout"
        required: true
      engines:
        description: "Comma-separated engines; the first is the baseline for the gates"
        default: "tess_fast,kiwi_fused_mnn16"
        required: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: System libraries for tesserocr and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev libleptonica-dev pkg-config
          python -m pip install --upgrade pip

      - name: Run the benchmark
        env:
          SET: ${{ inputs.set }}
          ENGINES: ${{ inputs.engines }}
          KIWI_BENCH_NO_VENV: "1"
        run: |
          python -m pip install --require-hashes -r tools/ocr-bench/requirements-lock.txt
          python -m playwright install --with-deps chromium
          GATES=""
          if [ "$SET" = "heldout" ]; then GATES="--gates"; fi
          python -I tools/ocr-bench/run.py --set "$SET" --engines "$ENGINES" $GATES

      - name: Upload scores
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-bench-${{ inputs.set }}
          path: |
            tools/ocr-bench/work/results/
          retention-days: 30
