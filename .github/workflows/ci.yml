# Build an UNSIGNED release APK and run all unit tests on every push and pull request.
# No secrets, no signing: release APKs are signed locally by the maintainer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests (JVM + Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build unsigned release APK and run lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintDebug

      - name: Check permissions (CAMERA only)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          # Only system permission allowed: CAMERA. The app-internal signature permission
          # added by androidx.core (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) is not a system permission.
          others=$(grep '^uses-permission:' permissions.txt \
            | grep -v "name='android.permission.CAMERA'" \
            | grep -v "name='com.fastkiwi.scan.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" || true)
          if [ -n "$others" ]; then echo "Unexpected permissions:"; echo "$others"; exit 1; fi
          for p in INTERNET ACCESS_NETWORK_STATE REQUEST_INSTALL_PACKAGES; do
            if grep -q "android.permission.$p'" permissions.txt; then echo "$p must not be requested"; exit 1; fi
          done

      - name: Upload unsigned APK and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-and-reports
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
          retention-days: 14

  reuse:
    name: reuse-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
