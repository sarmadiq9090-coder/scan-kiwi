name: "اقتراح / Suggestion"
description: "اقترح تحسينًا أو ميزة — Suggest an improvement or a feature"
title: "[Scan Kiwi] اقتراح: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: "ما الذي تقترحه؟ ولماذا يفيدك؟ — What do you suggest, and how would it help you?"
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: "معلومات الجهاز (اختياري) — Device information (optional)"
      render: text
    validations:
      required: false
