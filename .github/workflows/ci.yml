# Build an UNSIGNED release APK and run all unit tests on every push and pull request.
# No secrets, no signing: release APKs are signed locally by the maintainer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Two distributions of one source tree: `full` (GitHub, with the in-app updater) and `fdroid`
      # (no updater, no INTERNET / ACCESS_NETWORK_STATE / REQUEST_INSTALL_PACKAGES).
      - name: Unit tests (JVM + Robolectric), both flavors
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest

      - name: Build unsigned release APKs (both flavors) and run lint
        run: ./gradlew --no-daemon :app:assembleFullRelease :app:assembleFdroidRelease :app:lintFullDebug

      # 2.0.1: 2.0.0's release build failed on a phone while every debug test passed. These run the
      # R8-shrunk release program itself: what it reaches by name, then Export / Share / Save (PDF checked
      # by Apache PDFBox) and the in-app updater against a local fake GitHub on port 443.
      - name: Release keep check (R8 and resource shrinking)
        run: ./gradlew --no-daemon :app:releaseKeepCheck

      - name: Release guard (export, share, save, update on the shrunk release program)
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          ./gradlew --no-daemon -PguardSdks=26,29,33,36 :app:releaseGuardTest :app:releaseUpdateGuardTest

      - name: Check permissions (exact list per flavor)
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2
          # Allowed in both: CAMERA. The app-internal signature permission added by androidx.core
          # (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION) is not a system permission.
          check() { # $1 = flavor, $2... = extra allowed (and required) permissions
            flavor=$1; shift
            APK=$(ls app/build/outputs/apk/$flavor/release/*.apk | head -n 1)
            "$AAPT2" dump permissions "$APK" | tee permissions-$flavor.txt
            allowed="CAMERA $*"
            others=$(grep '^uses-permission:' permissions-$flavor.txt | grep -v "name='com.fastkiwi.scan.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" || true)
            for p in $allowed; do others=$(echo "$others" | grep -v "name='android.permission.$p'" || true); done
            if [ -n "$others" ]; then echo "Unexpected permissions in $flavor:"; echo "$others"; exit 1; fi
            for p in $allowed; do grep -q "name='android.permission.$p'" permissions-$flavor.txt || { echo "Missing $p in $flavor"; exit 1; }; done
          }
          # full: since 2.0 (owner's order 2026-11-15) INTERNET, ACCESS_NETWORK_STATE and
          # REQUEST_INSTALL_PACKAGES for the GitHub-only update check.
          check full INTERNET ACCESS_NETWORK_STATE REQUEST_INSTALL_PACKAGES
          # fdroid: CAMERA only (no updater, no network).
          check fdroid
          # The update client is the only network code: no other URL connection in the sources.
          hits=$(grep -rln 'openConnection\|HttpURLConnection\|java.net.Socket\|okhttp' app/src/main/java | grep -v 'update/UpdateClient.kt' || true)
          if [ -n "$hits" ]; then echo "Network code outside update/UpdateClient.kt:"; echo "$hits"; exit 1; fi

      - name: Upload unsigned APK and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk-and-reports
          path: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/reports/
          retention-days: 14

  reuse:
    name: reuse-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
